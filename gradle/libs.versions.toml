espressoCore = "3.7.0"
kotlinpoet = "2.2.0"
kotlinpoetKsp = "2.2.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.09.01"
hilt = "2.57.2"
ksp = "2.2.21-2.0.4"
retrofit = "2.9.0"
okhttp = "4.12.0"
moshi = "1.15.2"
coil = "3.3.0"
amplitude = "1.22.3"
amplitudeSessionReplay = "0.20.15"
roomCompiler = "2.8.4"
roomKtx = "2.8.4"
